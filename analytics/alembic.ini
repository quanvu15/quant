# Alembic configuration for the Analytics microservice.
# The actual database URL is injected at runtime from settings.DATABASE_URL
# inside alembic/env.py — the sqlalchemy.url value here is a placeholder
# that env.py overrides before any migration runs.

[alembic]
# Path to migration scripts (relative to this file)
script_location = alembic

# Template for new migration file names
file_template = %%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

# Truncate long revision messages in filenames
truncate_slug_length = 40

# Prepend sys.path with the project root so `from app.config import settings`
# works inside env.py without installing the package.
prepend_sys_path = .

# Placeholder — overridden by env.py using settings.DATABASE_URL
sqlalchemy.url = postgresql+psycopg2://placeholder/placeholder

[post_write_hooks]
# Uncomment to auto-format new migration files with ruff:
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

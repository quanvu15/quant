name: Analytics Microservice CI

on:
  push:
    branches: [main, develop]
    paths:
      - "analytics/**"
  pull_request:
    branches: [main]
    paths:
      - "analytics/**"

defaults:
  run:
    working-directory: analytics

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install ruff mypy types-redis pydantic pydantic-settings

      - name: Run ruff
        run: .venv/bin/ruff check .

      - name: Run mypy
        run: .venv/bin/mypy app/ core/ models/ --ignore-missing-imports

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379/15
          MASTER_API_KEY: analytics_admin_test_key
          JWT_SECRET_KEY: test-secret-key
        run: .venv/bin/python -m pytest tests/ -v --cov=app --cov=core --cov=models --cov-report=term-missing

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t analytics-api:ci .
